services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: recall
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg2://recall:${POSTGRES_PASSWORD}@db:5432/recall
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (32+ random chars)}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes: [uploads:/data/uploads]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  pgdata:
  uploads:
