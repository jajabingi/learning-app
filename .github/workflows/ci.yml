name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:logging

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: recall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # provider-style URL on purpose: proves postgresql:// is normalised for the psycopg2 driver
      DATABASE_URL: postgresql://recall:ci-only-password@localhost:5432/recall
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123
      AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade an empty database to the latest migration
        run: alembic upgrade head
      - name: Create the first admin and read it back
        env:
          RECALL_PASSWORD: ci-admin-password-1
          RECALL_CLI_SKIP_MIGRATE: "1"
        run: |
          python -m app.cli create-admin --email ci@example.com
          python -m app.cli list-users | grep ci@example.com

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
