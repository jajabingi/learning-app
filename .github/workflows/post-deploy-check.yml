name: Post-deploy check

# After a push to main, Render and Vercel deploy by themselves. This waits for the new backend to answer and fails loudly
# if production is not healthy (so a broken deploy is noticed in minutes, not days).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.PROD_API_URL || 'https://learning-app-kstz.onrender.com' }}
      SITE: ${{ vars.PROD_SITE_URL }}
    steps:
      - name: Wait for the backend (up to 12 minutes: deploys and cold starts take a while)
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API/api/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Backend did not become healthy"; exit 1
      - name: Public endpoints answer with JSON
        run: |
          curl -fsS --max-time 30 "$API/api/auth/config" | grep -q registration_enabled
          curl -fsS --max-time 30 "$API/api/public/institutions" | grep -q '^\['
      - name: The website proxies /api to the backend (only when PROD_SITE_URL is set)
        if: env.SITE != ''
        run: |
          curl -fsS --max-time 30 "$SITE/api/health" | grep -q '"status":"ok"'
          curl -fsS --max-time 30 "$SITE/teachers" | grep -qi "<div id=\"root\""
